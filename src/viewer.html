<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D model views</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1120px; height: 680px; overflow: hidden; }
    body { background: #f3f5f8; color: #202633; font: 15px Arial, sans-serif; }
    #collage { width: 1120px; height: 680px; padding: 24px; }
    header { height: 72px; display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; max-width: 900px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 22px; font-weight: 700; }
    .subtitle { margin-top: 7px; color: #677387; font-size: 13px; }
    .tag { color: #44566e; border: 1px solid #d9e1eb; border-radius: 6px; padding: 7px 10px; font-size: 12px; font-weight: 700; }
    .views { display: flex; gap: 20px; }
    .panel { width: 526px; height: 546px; padding: 8px; background: white; border: 1px solid #dce3eb; border-radius: 10px; box-shadow: 0 3px 12px #25385012; }
    .panel img { display: block; width: 508px; height: 490px; object-fit: fill; border-radius: 5px; background: #e9edf2; }
    .caption { display: flex; justify-content: space-between; align-items: center; height: 38px; padding: 0 5px; font-size: 13px; font-weight: 700; letter-spacing: .03em; }
    .caption span:last-child { color: #7a8797; font-size: 11px; font-weight: 500; letter-spacing: 0; }
    footer { margin-top: 15px; color: #647184; font-size: 12px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/three/build/three.module.js",
        "three/addons/": "/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="collage">
    <header>
      <div><h1 id="model-name">3D model</h1><div class="subtitle">Orthographic model views</div></div>
      <div class="tag" id="format">MODEL</div>
    </header>
    <div class="views">
      <div class="panel"><img id="front" alt="Front view"><div class="caption"><span>FRONT</span><span>camera at +Z</span></div></div>
      <div class="panel"><img id="side" alt="Right side view"><div class="caption"><span>RIGHT SIDE</span><span>camera at +X</span></div></div>
    </div>
    <footer id="footer">Views use the source model orientation.</footer>
  </div>
  <script type="module" src="/renderer.js"></script>
</body>
</html>
